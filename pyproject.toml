[project]
name = "mcp-secure-reports"
version = "0.1.0"
description = "Role gated MCP server that lets an AI agent export reports from a system with no API, with audit logging and an encrypted credential vault"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "mcp>=2.0",
    "cryptography>=43.0.0",
    "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]
playwright = ["playwright>=1.48.0"]

[project.scripts]
secure-reports-mcp = "secure_reports_mcp.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
